[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-client"
version = "0.2.0"
description = "Python client and session guard for the Airlock agent control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
airlock = "airlock:main"

[tool.setuptools]
py-modules = ["airlock"]
